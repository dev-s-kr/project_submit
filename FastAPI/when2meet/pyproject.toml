[project]
name = "when2meet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aerich==0.8.1",
    "cryptography==44.0.0",
    "httpie>=3.2.4",
    "httpx==0.28.1",
    "orjson==3.10.12",
    "pydantic-settings==2.7.1",
    "sqids>=0.5.2",
    "tomlkit==0.13.2",
    "tortoise-orm[asyncmy]==0.23.0",
]

[dependency-groups]
dev = ["black==24.10.0", "coverage==7.6.9", "mypy==1.13.0", "pytest==8.3.4", "pytest-asyncio==0.25.0", "ruff==0.8.2"]

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py313"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = 3.13
strict = true

[tool.coverage.run]
omit = ["*/test_*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = "ignore::DeprecationWarning"

[tool.aerich]
tortoise_orm = "app.configs.tortoise_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
